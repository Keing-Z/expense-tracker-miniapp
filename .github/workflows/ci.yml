name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit - store
        run: node test/store.test.js
      - name: Unit - backup
        run: node test/backup.test.js
      - name: Integration
        run: node test/integration.test.js
      - name: Static consistency
        run: node test/static.test.js
